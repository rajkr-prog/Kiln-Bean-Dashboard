<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiln &amp; Bean – Sales dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F7;--card:#FFFFFF;--ink:#1B2340;--muted:#6B7494;--line:#E1E5F0;
  --a1:#4B4ACF;--a2:#14A38B;--a3:#F2A93B;--a4:#E5586E;--soft:#F5F7FC;
  --head:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111529;--card:#1A2040;--ink:#EEF0FA;--muted:#9AA3C7;--line:#2A3159;--soft:#212850;
    --a1:#8C8BFF;--a2:#35C9AF;--a3:#F5B955;--a4:#FF7C90;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111529;--card:#1A2040;--ink:#EEF0FA;--muted:#9AA3C7;--line:#2A3159;--soft:#212850;
  --a1:#8C8BFF;--a2:#35C9AF;--a3:#F5B955;--a4:#FF7C90;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body)}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 48px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:24px}
h1{font:700 30px/1.1 var(--head);margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);margin:4px 0 0}
.tools{display:flex;gap:10px;align-items:center}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button,.theme{font:500 14px var(--body);color:var(--muted);background:none;border:0;padding:7px 14px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--a1);color:#fff}
.theme{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
button:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.hero{grid-column:span 8;background:linear-gradient(160deg,var(--a1),#2E2D8F);color:#fff;border:0;padding:24px}
.hero .lbl{opacity:.8}
.big{font:700 52px/1 var(--head);letter-spacing:-.03em;margin:6px 0 4px}
.delta{display:inline-block;background:rgba(255,255,255,.18);border-radius:99px;padding:2px 10px;font-weight:600;font-size:13px}
.chartbox{position:relative;margin-top:14px}
.chartbox svg{width:100%;height:auto;display:block;overflow:visible}
.tip{position:absolute;pointer-events:none;background:#fff;color:#1B2340;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);transform:translate(-50%,-120%);opacity:0;transition:opacity .12s;white-space:nowrap}
.kpis{grid-column:span 4;display:grid;grid-template-rows:repeat(3,1fr);gap:16px}
.kpi{display:flex;justify-content:space-between;align-items:center;gap:12px}
.kpi b{font:700 28px/1.1 var(--head);display:block;letter-spacing:-.02em}
.lbl{color:var(--muted);font-size:13.5px;font-weight:500}
.up{color:var(--a2);font-weight:600;font-size:13px}.down{color:var(--a4);font-weight:600;font-size:13px}
.spark{width:96px;height:36px;flex:none}
h2{font:700 18px/1.2 var(--head);margin:0 0 14px}
.c5{grid-column:span 5}.c7{grid-column:span 7}.c12{grid-column:span 12}
.bar{margin:12px 0}
.bar div.row{display:flex;justify-content:space-between;font-weight:500;margin-bottom:6px}
.bar .track{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.donutwrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{width:160px;height:160px;flex:none}
.legend{list-style:none;margin:0;padding:0;flex:1;min-width:150px}
.legend li{display:flex;align-items:center;gap:10px;padding:6px 0}
.legend i{width:12px;height:12px;border-radius:4px;flex:none}
.legend span:last-child{margin-left:auto;font-weight:600}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:13px 10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#fff;font-weight:600;font-size:12px;margin-right:10px;vertical-align:middle}
.pill{padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:600}
.s-paid{background:color-mix(in srgb,var(--a2) 18%,transparent);color:var(--a2)}
.s-ship{background:color-mix(in srgb,var(--a3) 22%,transparent);color:var(--a3)}
.s-ref{background:color-mix(in srgb,var(--a4) 18%,transparent);color:var(--a4)}
.num{text-align:right;font-weight:600}
.sbtn{font:600 14px var(--body);color:#fff;background:var(--a2);border:0;border-radius:12px;padding:9px 16px;cursor:pointer}
.sbtn[aria-expanded="true"]{background:var(--ink);color:var(--card)}
.sectors[hidden]{display:none}
.shead{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.srow{display:grid;grid-template-columns:28px 1fr auto auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.rank{font:700 18px var(--head);color:var(--muted)}
.srow .track{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:6px}
.srow .fill{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.srow .amt{font-weight:600;text-align:right;min-width:80px}
.srow .chg{min-width:52px;text-align:right}
@media (max-width:600px){.srow{grid-template-columns:24px 1fr auto}.srow .chg{display:none}}
@media (max-width:900px){.hero,.kpis,.c5,.c7{grid-column:span 12}.kpis{grid-template-rows:none}.big{font-size:42px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Kiln &amp; Bean</h1>
      <p class="sub">Sales overview · sample data</p>
    </div>
    <div class="tools">
      <button class="sbtn" id="sectorBtn" aria-expanded="false" aria-controls="sectors">Top selling sectors</button>
      <div class="seg" id="range" role="group" aria-label="Date range">
        <button data-r="7" aria-pressed="false">7 days</button>
        <button data-r="30" aria-pressed="true">30 days</button>
        <button data-r="90" aria-pressed="false">90 days</button>
      </div>
      <button class="theme" id="theme" aria-label="Toggle dark mode">◐</button>
    </div>
  </header>

  <div class="grid">
    <section class="card hero">
      <div class="lbl">Revenue</div>
      <div class="big" id="rev">$0</div>
      <span class="delta" id="revd">+0%</span>
      <div class="chartbox" id="chart"><div class="tip" id="tip"></div></div>
    </section>

    <section class="kpis" id="kpis"></section>

    <section class="card c12 sectors" id="sectors" hidden>
      <div class="shead"><h2>Top selling sectors</h2><span class="lbl" id="sectorNote"></span></div>
      <div id="sectorList"></div>
    </section>

    <section class="card c5">
      <h2>Top roasts</h2>
      <div id="bars"></div>
    </section>

    <section class="card c7">
      <h2>Where orders come from</h2>
      <div class="donutwrap">
        <svg class="donut" id="donut" viewBox="0 0 42 42" role="img" aria-label="Order channels"></svg>
        <ul class="legend" id="legend"></ul>
      </div>
    </section>

    <section class="card c12">
      <h2>Recent orders</h2>
      <div class="scroll">
        <table>
          <thead><tr><th>Customer</th><th>Item</th><th>Status</th><th class="num">Total</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </div>
</div>

<script>
(function(){
  var C=getComputedStyle(document.documentElement);
  function v(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
  var seed=42;function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646}
  var money=function(n){return "$"+Math.round(n).toLocaleString("en-US")};
  var state={r:30};

  function series(n){
    var out=[],base=2400;
    for(var i=0;i<n;i++){base+= (rnd()-.42)*320;base=Math.max(1400,base);out.push(Math.round(base+Math.sin(i/2.3)*260))}
    return out;
  }
  var DATA={7:series(7),30:series(30),90:series(90)};

  function path(pts){
    var d="M"+pts[0][0]+","+pts[0][1];
    for(var i=1;i<pts.length;i++){var mx=(pts[i-1][0]+pts[i][0])/2;d+=" C"+mx+","+pts[i-1][1]+" "+mx+","+pts[i][1]+" "+pts[i][0]+","+pts[i][1]}
    return d;
  }

  function drawChart(){
    var d=DATA[state.r],W=700,H=230,P=8,box=document.getElementById("chart");
    var max=Math.max.apply(null,d),min=Math.min.apply(null,d);
    var pts=d.map(function(y,i){return [P+i*(W-2*P)/(d.length-1),H-20-((y-min)/(max-min||1))*(H-60)]});
    var line=path(pts),area=line+" L"+pts[pts.length-1][0]+","+H+" L"+pts[0][0]+","+H+" Z";
    var old=box.querySelector("svg");if(old)old.remove();
    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Revenue over time">'+
      '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>'+
      '<path d="'+area+'" fill="url(#g)"/><path d="'+line+'" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>'+
      '<line id="vl" y1="0" y2="'+H+'" stroke="#fff" stroke-opacity=".5" stroke-dasharray="3 4" style="display:none"/>'+
      '<circle id="dot" r="6" fill="#fff" stroke="#F2A93B" stroke-width="3" style="display:none"/></svg>';
    box.insertAdjacentHTML("afterbegin",s);
    var svg=box.querySelector("svg"),dot=svg.querySelector("#dot"),vl=svg.querySelector("#vl"),tip=document.getElementById("tip");
    svg.addEventListener("pointermove",function(e){
      var r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W;
      var i=Math.max(0,Math.min(d.length-1,Math.round((x-P)/((W-2*P)/(d.length-1)))));
      var p=pts[i];dot.setAttribute("cx",p[0]);dot.setAttribute("cy",p[1]);dot.style.display="";
      vl.setAttribute("x1",p[0]);vl.setAttribute("x2",p[0]);vl.style.display="";
      var ago=d.length-1-i;
      tip.textContent=money(d[i])+" · "+(ago===0?"today":ago+"d ago");
      tip.style.left=(p[0]/W*r.width)+"px";tip.style.top=(p[1]/H*r.height)+"px";tip.style.opacity=1;
    });
    svg.addEventListener("pointerleave",function(){dot.style.display="none";vl.style.display="none";tip.style.opacity=0});
    var total=d.reduce(function(a,b){return a+b},0);
    document.getElementById("rev").textContent=money(total);
    var pct=(5+rnd()*14).toFixed(1);
    document.getElementById("revd").textContent="+"+pct+"% vs previous period";
  }

  function spark(vals,color){
    var w=96,h=36,mx=Math.max.apply(null,vals),mn=Math.min.apply(null,vals);
    var pts=vals.map(function(y,i){return [i*w/(vals.length-1),h-4-((y-mn)/(mx-mn||1))*(h-8)]});
    return '<svg class="spark" viewBox="0 0 96 36" aria-hidden="true"><path d="'+path(pts)+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round"/></svg>';
  }

  function kpis(){
    var items=[["Orders","1,284","+8.2%",1,"--a2"],["Average order","$34.60","+2.1%",1,"--a1"],["Repeat customers","46%","−1.4%",0,"--a4"]];
    document.getElementById("kpis").innerHTML=items.map(function(k){
      var vals=[];for(var i=0;i<10;i++)vals.push(rnd()*10+(k[3]?i:10-i*.6));
      return '<div class="card kpi"><div><div class="lbl">'+k[0]+'</div><b>'+k[1]+'</b><span class="'+(k[3]?"up":"down")+'">'+k[2]+'</span></div>'+spark(vals,v(k[4]))+'</div>';
    }).join("");
  }

  function bars(){
    var items=[["Ethiopia Guji",86,"--a1"],["Colombia Huila",71,"--a2"],["Kenya AA",58,"--a3"],["House blend",44,"--a4"],["Decaf Swiss Water",19,"--a1"]];
    var el=document.getElementById("bars");
    el.innerHTML=items.map(function(b){return '<div class="bar"><div class="row"><span>'+b[0]+'</span><span>'+b[1]*14+' bags</span></div><div class="track"><div class="fill" style="width:0;background:'+v(b[2])+'" data-w="'+b[1]+'"></div></div></div>'}).join("");
    requestAnimationFrame(function(){el.querySelectorAll(".fill").forEach(function(f){f.style.width=f.dataset.w+"%"})});
  }

  function donut(){
    var parts=[["Website",48,"--a1"],["Subscriptions",27,"--a2"],["Wholesale",15,"--a3"],["Market stall",10,"--a4"]];
    var r=15.9,off=25,svg='<circle cx="21" cy="21" r="'+r+'" fill="none" stroke="'+v("--soft")+'" stroke-width="6"/>';
    parts.forEach(function(p){svg+='<circle cx="21" cy="21" r="'+r+'" fill="none" stroke="'+v(p[2])+'" stroke-width="6" stroke-dasharray="'+(p[1]-.8)+' '+(100-p[1]+.8)+'" stroke-dashoffset="'+off+'"/>';off-=p[1]});
    svg+='<text x="21" y="22" text-anchor="middle" font-size="7" font-weight="700" fill="'+v("--ink")+'" font-family="Bricolage Grotesque,sans-serif">1,284</text><text x="21" y="27.5" text-anchor="middle" font-size="3" fill="'+v("--muted")+'">orders</text>';
    document.getElementById("donut").innerHTML=svg;
    document.getElementById("legend").innerHTML=parts.map(function(p){return '<li><i style="background:'+v(p[2])+'"></i><span>'+p[0]+'</span><span>'+p[1]+'%</span></li>'}).join("");
  }

  function rows(){
    var R=[["Maya Chen","Ethiopia Guji, 250 g","Paid","$18.50","#4B4ACF"],["Tomás Rivera","Monthly subscription","Shipped","$42.00","#14A38B"],["Priya Nair","Kenya AA, 1 kg","Paid","$64.00","#F2A93B"],["Oliver Brandt","House blend, 2 bags","Refunded","$28.00","#E5586E"],["Aiko Tanaka","Brew kit bundle","Shipped","$96.50","#4B4ACF"]];
    document.getElementById("rows").innerHTML=R.map(function(r){
      var c=r[2]==="Paid"?"s-paid":r[2]==="Shipped"?"s-ship":"s-ref";
      var ini=r[0].split(" ").map(function(w){return w[0]}).join("");
      return '<tr><td><span class="av" style="background:'+r[4]+'">'+ini+'</span>'+r[0]+'</td><td>'+r[1]+'</td><td><span class="pill '+c+'">'+r[2]+'</span></td><td class="num">'+r[3]+'</td></tr>';
    }).join("");
  }

  function sectors(){
    var S=[["Cafés",48200,12.4,"--a1"],["Restaurants",31900,6.8,"--a2"],["Offices",24600,3.1,"--a3"],["Hotels",18300,-2.2,"--a4"],["Grocers",11700,9.5,"--a1"]];
    var k=state.r/30,max=S[0][1]*k;
    document.getElementById("sectorNote").textContent="Last "+state.r+" days · sample data";
    var el=document.getElementById("sectorList");
    el.innerHTML=S.map(function(s,i){
      return '<div class="srow"><span class="rank">'+(i+1)+'</span><div><div>'+s[0]+'</div><div class="track"><div class="fill" style="width:0;background:'+v(s[3])+'" data-w="'+(s[1]*k/max*100)+'"></div></div></div><span class="amt">'+money(s[1]*k)+'</span><span class="chg '+(s[2]>=0?'up':'down')+'">'+(s[2]>=0?'+':'−')+Math.abs(s[2])+'%</span></div>';
    }).join("");
    requestAnimationFrame(function(){el.querySelectorAll(".fill").forEach(function(f){f.style.width=f.dataset.w+"%"})});
  }

  function renderAll(){kpis();bars();donut();rows();sectors();drawChart()}
  renderAll();

  document.getElementById("range").addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    state.r=+b.dataset.r;
    this.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-pressed",x===b)});
    sectors();
    drawChart();
  });
  document.getElementById("sectorBtn").addEventListener("click",function(){
    var p=document.getElementById("sectors"),open=p.hidden;
    p.hidden=!open;this.setAttribute("aria-expanded",open);
    if(open){sectors();p.scrollIntoView({block:"nearest"})}
  });
  document.getElementById("theme").addEventListener("click",function(){
    var el=document.documentElement,dark=el.getAttribute("data-theme")?el.getAttribute("data-theme")==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
    el.setAttribute("data-theme",dark?"light":"dark");
    renderAll();
  });
})();
</script>
</body>
</html>
